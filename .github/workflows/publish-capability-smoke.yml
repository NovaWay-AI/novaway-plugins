name: Publish capability smoke plugin

on:
  push:
    tags:
      - 'com.novaway.marketplace-capability-smoke-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate
      - run: python scripts/build_plugin.py com.novaway.marketplace-capability-smoke --stored
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -e 'const x=require("./plugins/com.novaway.marketplace-capability-smoke/plugin.json"); console.log(x.version)')"
          tag="com.novaway.marketplace-capability-smoke-v${version}"
          gh release create "$tag" dist/com.novaway.marketplace-capability-smoke-"${version}".zip --title "$tag" --generate-notes
