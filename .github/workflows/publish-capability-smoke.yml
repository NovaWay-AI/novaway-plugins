name: Publish capability smoke plugin

on:
  push:
    tags:
      - 'com.novaway.marketplace-capability-smoke-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate
      - run: python scripts/build_plugin.py com.novaway.marketplace-capability-smoke --stored
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -e 'const x=require("./plugins/com.novaway.marketplace-capability-smoke/plugin.json"); console.log(x.version)')"
          tag="com.novaway.marketplace-capability-smoke-v${version}"
          gh release create "$tag" dist/com.novaway.marketplace-capability-smoke-"${version}".zip --title "$tag" --generate-notes
      - name: Verify the published asset matches the catalog
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -e 'const x=require("./plugins/com.novaway.marketplace-capability-smoke/plugin.json"); console.log(x.version)')"
          asset="com.novaway.marketplace-capability-smoke-${version}.zip"
          url="https://github.com/NovaWay-AI/novaway-plugins/releases/download/com.novaway.marketplace-capability-smoke-v${version}/${asset}"
          curl --fail --location --silent --show-error "$url" -o "$RUNNER_TEMP/$asset"
          actual_sha="$(sha256sum "$RUNNER_TEMP/$asset" | cut -d' ' -f1)"
          actual_size="$(wc -c < "$RUNNER_TEMP/$asset")"
          expected_sha="$(node -e 'const x=require("./catalog/index.json"); const e=x.entries.find((item) => item.packageId === "com.novaway.marketplace-capability-smoke"); console.log(e.artifacts[0].sha256)')"
          expected_size="$(node -e 'const x=require("./catalog/index.json"); const e=x.entries.find((item) => item.packageId === "com.novaway.marketplace-capability-smoke"); console.log(e.artifacts[0].size)')"
          test "$actual_sha" = "$expected_sha"
          test "$actual_size" = "$expected_size"
