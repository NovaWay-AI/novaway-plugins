name: Publish Office suite plugin

on:
  push:
    tags:
      - 'com.novaway.office-suite-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate
      - run: python scripts/build_plugin.py com.novaway.office-suite --stored
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -e 'const x=require("./plugins/com.novaway.office-suite/plugin.json"); console.log(x.version)')"
          tag="com.novaway.office-suite-v${version}"
          asset="dist/com.novaway.office-suite-${version}.zip"
          # 删除再重推 tag 会把已有 Release 变成 draft；按 tag_name 查找（含 draft）并恢复发布。
          release_id="$(gh api repos/{owner}/{repo}/releases --paginate -q '.[] | select(.tag_name=="'"$tag"'") | .id' | head -n1)"
          if [ -n "$release_id" ]; then
            echo "Release $tag already exists (id $release_id); ensuring it is published."
            gh api -X PATCH "repos/{owner}/{repo}/releases/$release_id" -F draft=false >/dev/null
          else
            gh release create "$tag" "$asset" --title "$tag" --generate-notes
          fi
          gh release upload "$tag" "$asset" --clobber
      - name: Verify the published asset matches the catalog
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -e 'const x=require("./plugins/com.novaway.office-suite/plugin.json"); console.log(x.version)')"
          asset="com.novaway.office-suite-${version}.zip"
          url="https://github.com/NovaWay-AI/novaway-plugins/releases/download/com.novaway.office-suite-v${version}/${asset}"
          curl --fail --location --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$url" -o "$RUNNER_TEMP/$asset"
          actual_sha="$(sha256sum "$RUNNER_TEMP/$asset" | cut -d' ' -f1)"
          actual_size="$(wc -c < "$RUNNER_TEMP/$asset")"
          expected_sha="$(VERSION="$version" node -e 'const x=require("./catalog/index.json"); const e=x.entries.find((item) => item.packageId === "com.novaway.office-suite" && item.version === process.env.VERSION); console.log(e.artifacts[0].sha256)')"
          expected_size="$(VERSION="$version" node -e 'const x=require("./catalog/index.json"); const e=x.entries.find((item) => item.packageId === "com.novaway.office-suite" && item.version === process.env.VERSION); console.log(e.artifacts[0].size)')"
          echo "actual   sha=$actual_sha size=$actual_size"
          echo "expected sha=$expected_sha size=$expected_size"
          test "$actual_sha" = "$expected_sha"
          test "$actual_size" = "$expected_size"