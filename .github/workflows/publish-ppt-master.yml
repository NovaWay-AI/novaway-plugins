name: Publish PPT Master plugin

on:
  push:
    tags:
      - 'com.novaway.ppt-master-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate
      - run: python scripts/build_plugin.py com.novaway.ppt-master --stored
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -e 'const x=require("./plugins/com.novaway.ppt-master/plugin.json"); console.log(x.version)')"
          tag="com.novaway.ppt-master-v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; verifying its immutable asset."
          else
            gh release create "$tag" dist/com.novaway.ppt-master-"${version}".zip --title "$tag" --generate-notes
          fi
          gh release upload "$tag" dist/com.novaway.ppt-master-"${version}".zip --clobber
      - name: Verify the published asset matches the catalog
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -e 'const x=require("./plugins/com.novaway.ppt-master/plugin.json"); console.log(x.version)')"
          asset="com.novaway.ppt-master-${version}.zip"
          url="https://github.com/NovaWay-AI/novaway-plugins/releases/download/com.novaway.ppt-master-v${version}/${asset}"
          curl --fail --location --silent --show-error "$url" -o "$RUNNER_TEMP/$asset"
          actual_sha="$(sha256sum "$RUNNER_TEMP/$asset" | cut -d' ' -f1)"
          actual_size="$(wc -c < "$RUNNER_TEMP/$asset")"
          expected_sha="$(VERSION="$version" node -e 'const x=require("./catalog/index.json"); const e=x.entries.find((item) => item.packageId === "com.novaway.ppt-master" && item.version === process.env.VERSION); console.log(e.artifacts[0].sha256)')"
          expected_size="$(VERSION="$version" node -e 'const x=require("./catalog/index.json"); const e=x.entries.find((item) => item.packageId === "com.novaway.ppt-master" && item.version === process.env.VERSION); console.log(e.artifacts[0].size)')"
          test "$actual_sha" = "$expected_sha"
          test "$actual_size" = "$expected_size"