name: Publish smoke plugin

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate
      - run: python scripts/build_plugin.py com.novaway.marketplace-smoke
      - name: Verify the release digest matches the catalog
        shell: bash
        run: |
          set -euo pipefail
          result="$(python scripts/build_plugin.py com.novaway.marketplace-smoke)"
          digest="$(node -e 'const x=JSON.parse(process.argv[1]); console.log(x.sha256)' "$result")"
          expected="$(node -e 'const x=require("./catalog/index.json"); console.log(x.entries[0].artifacts[0].sha256)' )"
          test "$digest" = "$expected"
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -e 'const x=require("./plugins/com.novaway.marketplace-smoke/plugin.json"); console.log(x.version)')"
          tag="com.novaway.marketplace-smoke-v${version}"
          gh release create "$tag" dist/com.novaway.marketplace-smoke-"${version}".zip --title "$tag" --generate-notes
